# OpenTalk 的 nginx 站点配置（单机：nginx 终止 TLS，静态文件由 nginx 提供，API 在内网）。
#
# 用法：
#   1. 替换所有 opentalk.example.com 为你的域名；
#   2. 放到 /etc/nginx/sites-available/opentalk 并软链到 sites-enabled/；
#   3. 先跑 certbot --nginx 拿到证书（它会补全 443 段与跳转），再 nginx -t && systemctl reload nginx。
#
# 为什么是这套形状：
#   - 前端是 hash 路由的 SPA，所以静态段必须 try_files … /index.html，否则刷新子路径会 404；
#   - /api/、/media/、/health、/ready 必须与浏览器同源转发到 API：写请求靠精确 Origin 校验，
#     Cookie 是 SameSite=Lax，跨源不会有 CORS 授权；
#   - 只有覆盖 X-Forwarded-For，才可以把 API 的 TRUST_PROXY 设为 true（否则按 IP 限流退化成全站配额）。

server {
    listen 80;
    listen [::]:80;
    server_name opentalk.example.com;

    # certbot --nginx 会在这一步之后把 80 段改成跳转到 https。
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name opentalk.example.com;

    # certbot 生成以下三项；手工签证书时改成你的路径。
    ssl_certificate     /etc/letsencrypt/live/opentalk.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opentalk.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 站点根目录 = 上传上来的 web/dist。构建产物带内容哈希，可以长缓存。
    root /srv/opentalk/web;
    index index.html;

    # 图片上传：单张上限由站点设置控制（默认 5 MiB），这里放宽到 12m 留出 multipart 开销。
    # 不设这个值，nginx 会在到达应用之前直接 413。
    client_max_body_size 12m;

    # 后端只读内网；超时给足图片解码与导出。
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # 覆盖（而不是追加）X-Forwarded-For：这正是 TRUST_PROXY=true 的前提。
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # ---- API：写请求、Cookie、CSRF 都要同源 ----
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
    }

    # ---- 受控图片：可见性由应用判定，nginx 只转发 ----
    location /media/ {
        proxy_pass http://127.0.0.1:8080;
        # 图片按 key 不可变；缓存交给浏览器，但不要把 403/404 也缓存住。
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
    }

    location = /ready {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
    }

    # ---- 静态资源 ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 不能缓存：否则发新版本后用户仍拿到旧页面引用的旧 chunk。
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # 其余路径交给 SPA（hash 路由只需要 index.html）。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 不要在日志里留下带 token 的查询串（退订链接的令牌就在 query 里）。
    access_log /var/log/nginx/opentalk.access.log combined;
}
